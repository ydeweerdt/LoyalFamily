name: CI

on:
  push:
    # main only: a Dependabot PR would otherwise run the full job twice (one push
    # run on its own branch + one pull_request run).
    branches: [main]
    # a v-tag publishes an immutable release image (publish job below)
    tags: ['v*']
  pull_request:
  # A CVE in a digest-pinned base image changes no file here, so without a clock
  # nothing re-runs Trivy / npm audit until the pin or a commit moves.
  # GitHub pauses schedule: after 60 days of repo inactivity.
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC
  workflow_dispatch:

# least privilege for the default GITHUB_TOKEN (CodeQL: missing-workflow-permissions);
# the publish job overrides this with packages: write
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # identical to local: everything in containers
      - name: unit + integration tests
        run: docker build --target test -t loyalfamily-test .

      - name: e2e golden flows (Playwright)
        run: docker build --target e2e-run -t loyalfamily-e2e .

      - name: runtime image
        run: docker build -t loyalfamily:latest .

      # fails the build on HIGH/CRITICAL in what actually ships (the prod-deps stage
      # is what the runtime image copies); the kit pins are past every advisory
      # published for this stack so far — see DESIGN §10
      - name: production dependency audit
        run: |
          docker build --target prod-deps -t loyalfamily-prod-deps .
          docker run --rm loyalfamily-prod-deps npm audit --omit=dev --audit-level=high

      - name: runtime image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loyalfamily:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # Push the runtime image to GitHub Packages so any machine can just pull it.
  # main → :latest + :<sha>; a v-tag → :<version> + :<sha>. Only the tag build is
  # immutable, same reason the Dockerfile pins base-image digests.
  publish:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # needed for the type=gha layer cache to actually be used
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # hardcoded lowercase image name: GHCR rejects repo names with capitals
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/ydeweerdt/loyalfamily
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
