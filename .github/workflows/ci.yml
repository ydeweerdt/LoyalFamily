name: CI

on:
  push:
  pull_request:

# least privilege for the default GITHUB_TOKEN (CodeQL: missing-workflow-permissions);
# the publish job overrides this with packages: write
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # identical to local: everything in containers
      - name: unit + integration tests
        run: docker build --target test -t loyalfamily-test .

      - name: e2e golden flows (Playwright)
        run: docker build --target e2e-run -t loyalfamily-e2e .

      - name: runtime image
        run: docker build -t loyalfamily:latest .

      # fails the build on HIGH/CRITICAL in what actually ships (the prod-deps stage
      # is what the runtime image copies); the two known LOW kit advisories are
      # mitigated — see DESIGN §10
      - name: production dependency audit
        run: |
          docker build --target prod-deps -t loyalfamily-prod-deps .
          docker run --rm loyalfamily-prod-deps npm audit --omit=dev --audit-level=high

      - name: runtime image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loyalfamily:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # Push the runtime image to GitHub Packages so any machine can just pull it.
  publish:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # needed for the type=gha layer cache to actually be used
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          # hardcoded lowercase: GHCR rejects repo names with capitals and
          # Actions expressions have no tolower()
          tags: |
            ghcr.io/ydeweerdt/loyalfamily:latest
            ghcr.io/ydeweerdt/loyalfamily:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
