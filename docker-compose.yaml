services:
  loyalfamily:
    image: loyalfamily:latest
    container_name: loyalfamily   # fixed name so `make backup` / docker exec work
    build:
      context: .
    # On a machine that should not build: drop `build:` and use
    # image: ghcr.io/ydeweerdt/loyalfamily:latest
    ports:
      - "3000:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Real secret lives in the untracked .env next to this file:
      #   echo "COOKIE_SECRET=$(openssl rand -hex 32)" > .env
      COOKIE_SECRET: "${COOKIE_SECRET:?missing: create .env with COOKIE_SECRET=$(openssl rand -hex 32)}"
      PUBLIC_URL: http://localhost:3000
      TZ: Europe/Brussels
    volumes:
      - loyalfamily-data:/data
    restart: unless-stopped

volumes:
  loyalfamily-data:
