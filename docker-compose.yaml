services:
  loyalfamily:
    image: loyalfamily:latest
    build:
      context: .
    ports:
      - "3000:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # CHANGE THIS: generate e.g. with `openssl rand -hex 32`
      COOKIE_SECRET: change-me-00000000000000000000000000000000
      PUBLIC_URL: http://localhost:3000
      TZ: Europe/Brussels
    volumes:
      - loyalfamily-data:/data
    restart: unless-stopped

volumes:
  loyalfamily-data:
